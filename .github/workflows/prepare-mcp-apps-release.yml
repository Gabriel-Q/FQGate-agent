name: 发布 MCP Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 必须与 mcp-apps/mcp-apps/apps.json 的 bundleVersion 一致
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fqgate-mcp-apps-release
  cancel-in-progress: false

jobs:
  publish:
    name: 构建、签名并更新 FQGate-releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: mcp-apps-production
    steps:
      - name: 检出 Agent 源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: agent
      - name: 检出正式发行仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fqgate/FQGate-releases
          token: ${{ secrets.FQGATE_RELEASES_TOKEN }}
          path: releases
      - name: 检出 FQGate 公钥
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fqgate/FQGate
          path: fqgate
      - name: 准备 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/mcp-apps/package-lock.json
      - name: 核对发布版本
        working-directory: agent
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          configured="$(node -p "require('./mcp-apps/mcp-apps/apps.json').bundleVersion")"
          test "$configured" = "$REQUESTED_VERSION"
          printf '%s' "$configured" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      - name: 安装依赖并运行验证
        working-directory: agent
        run: |
          npm --prefix mcp-apps ci
          npm test
      - name: 生成签名发布目录
        working-directory: agent
        env:
          FQGATE_MCP_APPS_ED25519_PRIVATE_KEY: ${{ secrets.FQGATE_MCP_APPS_ED25519_PRIVATE_KEY }}
        run: >-
          npm run release:mcp-apps --
          --output ../releases/releases/v2/mcp-apps
      - name: 用主程序内置公钥验收
        working-directory: agent
        run: >-
          node mcp-apps/scripts/verify-mcp-apps-release.mjs
          --release-root ../releases/releases/v2/mcp-apps
          --public-key-file ../fqgate/assets/release/mcp-apps-ed25519-public.pem
          --version "${{ inputs.version }}"
      - name: 提交稳定通道
        working-directory: releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/v2/mcp-apps
          git diff --cached --check
          git commit -m "发布 MCP Apps ${{ inputs.version }}"
          git push origin HEAD:main
