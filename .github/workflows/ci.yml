name: Agent 插件持续集成

on:
  workflow_dispatch:
  push:
    branches: [main, V2]
  pull_request:
    branches: [main, V2]

permissions:
  contents: read

concurrency:
  group: fqgate-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 插件、Skill 与 MCP Apps 门禁
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-apps/package-lock.json
      - name: 安装 MCP Apps 依赖
        run: npm --prefix mcp-apps ci
      - name: 校验插件结构与技能路由
        run: npm run test:plugin
      - name: 构建并校验 MCP Apps
        run: npm --prefix mcp-apps run test:mcp-apps
